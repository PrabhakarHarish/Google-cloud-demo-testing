[pytest]
minversion = 8.0
testpaths = testing_project/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v -s
markers =
    e2e: End-to-end Playwright UI and browser tests
    grpc: Direct gRPC microservices contract and API tests
    cloud: Cloud infrastructure, Kubernetes manifests, and resilience tests
